    <form id="form-contacto" action="https://api.web3forms.com/submit" method="POST">
      <div class="row mb-3">
        <div class="col-md-6">
          <input type="hidden" name="access_key" value="fbe4526e-216c-4812-a1d5-994beb6c6247">
          <input type="hidden" name="replyto" value="@"> 
          <input type="hidden" name="from_name" value="Web S.D. San Pedro">
          <input type="hidden" name="subject" value="Nuevo contacto desde la web del Club">
          <label for="mailContacto" class="form-label" data-i18n="contacto-email-label">Email</label>
          <input type="email" class="form-control" name="mailContacto" id="mailContacto" data-i18n="contacto-email-placeholder" placeholder="nombre@ejemplo.com" required>
        </div>
        <div class="col-md-6">
          <label for="asuntoContacto" class="form-label" data-i18n="contacto-subject-label">Asunto</label>
          <input type="text" class="form-control" name="asuntoContacto" id="asuntoContacto" data-i18n="contacto-subject-placeholder" placeholder="Asunto del mensaje" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-12">
          <label for="mensajeContacto" class="form-label" data-i18n="contacto-message-label">Mensaje</label>
          <textarea class="form-control" name="mensajeContacto" id="mensajeContacto" rows="4" data-i18n="contacto-message-placeholder" placeholder="Escribe tu mensaje aquí" required></textarea>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <button type="submit" class="btn boton-admin" data-i18n="contacto-button">Enviar mensaje</button>
        </div>
      </div>
    </form>
